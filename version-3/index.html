<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberOS Functional Terminal</title>
    <style>
        body, html {
            background-color: #030303;
            color: #00ff66;
            font-family: 'Consolas', 'Courier New', monospace;
            padding: 0;
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        #terminal-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            z-index: 2;
        }

        #output {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.5;
            margin-bottom: 10px;
            text-shadow: 0 0 3px rgba(0, 255, 102, 0.3);
        }

        .input-line {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.02);
            padding: 5px 10px;
            border-radius: 4px;
            border-left: 3px solid #00ff66;
        }

        .prompt {
            color: #00ffaa;
            margin-right: 10px;
            user-select: none;
            font-weight: bold;
        }

        #command-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: inherit;
            font-size: 16px;
            flex-grow: 1;
            outline: none;
        }

        /* Farbschemata für Output */
        .sys { color: #00aaff; }
        .err { color: #ff3344; }
        .success { color: #ffcc00; }
        .highlight { color: #ffffff; font-weight: bold; }

        /* Matrix Canvas */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: none;
            opacity: 0.15;
        }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<div id="terminal-container">
    <div id="output"><span class="sys">=== CyberOS Kernel v4.0-Active ===</span>
Willkommen im funktionalen Web-Terminal.
Tippe <span class="highlight">'help'</span> für die Befehlsliste.

</div>
    <div class="input-line">
        <span class="prompt">core@cyberos:~$</span>
        <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
    </div>
</div>

<script>
    const input = document.getElementById('command-input');
    const output = document.getElementById('output');
    const container = document.getElementById('terminal-container');
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');

    let history = [];
    let histIndex = -1;
    let matrixInterval = null;

    container.addEventListener('click', () => input.focus());

    input.addEventListener('keydown', async function(e) {
        if (e.key === 'Enter') {
            const cmdLine = input.value.trim();
            input.value = '';
            if (cmdLine.length > 0) {
                history.push(cmdLine);
                histIndex = history.length;
                await handleCommand(cmdLine);
            }
        } else if (e.key === 'ArrowUp' && histIndex > 0) {
            histIndex--;
            input.value = history[histIndex];
        } else if (e.key === 'ArrowDown') {
            if (histIndex < history.length - 1) {
                histIndex++;
                input.value = history[histIndex];
            } else {
                histIndex = history.length;
                input.value = '';
            }
        }
    });

    function print(text, styleClass = '') {
        const span = document.createElement('span');
        span.className = styleClass;
        span.innerText = text + '\n';
        output.appendChild(span);
        output.scrollTop = output.scrollHeight;
    }

    async function handleCommand(line) {
        print(`core@cyberos:~$ ${line}`, 'highlight');
        
        const args = line.split(' ');
        const cmd = args[0].toLowerCase();
        const parameter = args.slice(1).join(' ');

        switch(cmd) {
            case 'help':
                print('Verfügbare Tools & Befehle:\n' +
                      '  weather [Stadt] - Holt echte Live-Wetterdaten aus einer API\n' +
                      '  myip            - Zeigt deine öffentliche IP & Geodaten\n' +
                      '  calc [Formel]   - Berechnet mathematische Formeln (z.B. calc (12+4)*3)\n' +
                      '  top / sysinfo   - Zeigt Systemressourcen und Browserdaten\n' +
                      '  matrix          - Aktiviert den Matrix-Regen-Bildschirmschoner (Beenden mit "exit")\n' +
                      '  clear           - Konsole leeren\n' +
                      '  exit            - Schließt Sonder-Modi oder Anwendungen');
                break;

            case 'weather':
                if (!parameter) {
                    print('Fehler: Bitte gib eine Stadt an. Beispiel: weather Berlin', 'err');
                    break;
                }
                print(`Rufe Wetterdaten für "${parameter}" ab...`, 'sys');
                try {
                    // Nutzung der freien wttr.in API (gibt reinen Text zurück, perfekt für Terminals)
                    const response = await fetch(`https://wttr.in{encodeURIComponent(parameter)}?0qT`);
                    if (!response.ok) throw new Error();
                    const data = await response.text();
                    print(data);
                } catch (e) {
                    print('Fehler beim Abrufen der Wetterdaten. Stadt richtig geschrieben?', 'err');
                }
                break;

            case 'myip':
                print('Verbinde mit IP-Server...', 'sys');
                try {
                    const res = await fetch('https://ipapi.co');
                    const data = await res.json();
                    print(`Öffentliche IP:  ${data.ip}\n` +
                          `Anbieter:        ${data.org}\n` +
                          `Standort:        ${data.city}, ${data.region} (${data.country_name})`, 'success');
                } catch (e) {
                    print('Fehler beim Abrufen der IP-Daten (Verbindung blockiert?).', 'err');
                }
                break;

            case 'calc':
                if (!parameter) {
                    print('Syntax: calc [Rechnung] - Beispiel: calc 5 * (10 / 2)', 'err');
                    break;
                }
                try {
                    // Sichere Berechnung ohne schädliches Standard-eval()
                    const sanitized = parameter.replace(/[^0-9+\-*/().\s]/g, '');
                    const result = new Function(`return ${sanitized}`)();
                    print(`Ergebnis: ${result}`, 'success');
                } catch (e) {
                    print('Mathematischer Fehler in der Formel.', 'err');
                }
                break;

            case 'top':
            case 'sysinfo':
                const ram = (navigator.deviceMemory || 'Unbekannt') + ' GB';
                const cores = navigator.hardwareConcurrency || 'Unbekannt';
                const userAgent = navigator.userAgent.split(' ').slice(-2).join(' ');
                
                print(`--- SYSTEM STATUS ---`, 'sys');
                print(`Betriebssystem (Plattform): ${navigator.platform}`);
                print(`Verfügbare CPU-Kerne:       ${cores}`);
                print(`Geschätzter RAM:            ${ram}`);
                print(`Browser Engine:             ${userAgent}`);
                print(`Simulierte CPU-Last:        ${Math.floor(Math.random() * 30) + 5}% (Normal)`, 'success');
                break;

            case 'matrix':
                print('Matrix-Modus aktiviert. Zum Beenden "exit" eintippen.', 'success');
                canvas.style.display = 'block';
                startMatrix();
                break;

            case 'exit':
                if (matrixInterval) {
                    clearInterval(matrixInterval);
                    matrixInterval = null;
                    canvas.style.style.display = 'none';
                    canvas.style.display = 'none';
                    print('Matrix-Modus beendet.', 'sys');
                } else {
                    print('Kein Prozess läuft im Hintergrund.', 'err');
                }
                break;

            case 'clear':
                output.innerHTML = '';
                break;

            default:
                print(`Kommando "${cmd}" ist unbekannt. Nutze 'help'.`, 'err');
        }
    }

    // Matrix Rain Code
    function startMatrix() {
        if (matrixInterval) clearInterval(matrixInterval);
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const rainDrops = Array(Math.floor(columns)).fill(1);

        matrixInterval = setInterval(() => {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }, 30);
    }

    window.addEventListener('resize', () => {
        if (matrixInterval) {
